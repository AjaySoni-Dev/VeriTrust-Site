        <!-- Admin Main Content -->
        <main class="admin-main" id="main-content">
            <div class="admin-page-header">
                <div class="admin-page-title-wrap">
                    <h1 class="admin-page-title">Manage Student Team</h1>
                    <p class="admin-page-desc">Add team organizers, update leadership roles, and manage bios.</p>
                </div>
            </div>

            <!-- Add Member Form -->
            <div class="admin-card-section">
                <h2 class="admin-section-title">Add Team Member</h2>
                <form id="admin-team-form">
                    <div class="form-grid-3">
                        <div class="form-group">
                            <label class="form-label" for="team-name">Full Name <span class="required">*</span></label>
                            <input type="text" id="team-name" class="form-control" placeholder="Aarav Sharma" required maxlength="100" autocomplete="name">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="team-role">Role Title <span class="required">*</span></label>
                            <input type="text" id="team-role" class="form-control" placeholder="Community Lead" required maxlength="100" autocomplete="organization-title">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="team-group">Group Category</label>
                            <select id="team-group" class="form-control">
                                <option value="leadership">Leadership</option>
                                <option value="core">Core Team</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grid-3 mt-3">
                        <div class="form-group">
                            <label class="form-label" for="team-linkedin">LinkedIn Profile URL</label>
                            <input type="url" id="team-linkedin" class="form-control" placeholder="https://linkedin.com/in/username">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="team-github">GitHub Profile URL</label>
                            <input type="url" id="team-github" class="form-control" placeholder="https://github.com/username">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="team-photo-file">Photo Upload</label>
                            <input type="file" id="team-photo-file" class="form-control" accept="image/jpeg,image/png,image/webp,image/avif">
                        </div>
                    </div>

                    <div class="form-group mt-3">
                        <label class="form-label" for="team-bio">Short Bio</label>
                        <textarea id="team-bio" class="form-control text-area-sm" placeholder="Brief background..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary mt-3">Add Team Member</button>
                </form>
            </div>

            <!-- Existing Team Roster -->
            <div class="admin-card-section">
                <h2 class="admin-section-title">Team Roster</h2>
                <div id="admin-team-container" aria-live="polite">
                    <!-- Rendered by js/admin.js -->
                </div>
            </div>
        </main>
