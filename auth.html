<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authentication | VERITRUST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/veritrust.css">
  <script src="assets/js/site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="nav">
      <a class="brand" href="index.html" aria-label="VERITRUST home">
        <img class="brand-mark" src="logo.png" alt="">
        <img class="brand-word" src="brand.png" alt="VERITRUST">
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="deepfake.html">Deepfake</a>
        <a href="phishing.html">Phishing</a>
        <a href="docs.html">Docs</a>
      </nav>
    </div>
  </header>

  <main class="auth-wrap">
    <section class="auth-card">
      <div class="brand">
        <img class="brand-mark" src="logo.png" alt="">
        <img class="brand-word" src="brand.png" alt="VERITRUST">
      </div>
      <div class="auth-tabs">
        <button class="tab-btn active" type="button" data-auth-tab="loginForm">Log in</button>
        <button class="tab-btn" type="button" data-auth-tab="signupForm">Create account</button>
      </div>

      <form id="loginForm" class="auth-form active" onsubmit="event.preventDefault();">
        <div class="field">
          <label for="loginEmail">Email address</label>
          <input id="loginEmail" class="input" type="email" placeholder="name@company.com" required>
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" class="input" type="password" placeholder="Password" required>
        </div>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>

      <form id="signupForm" class="auth-form" onsubmit="event.preventDefault();">
        <div class="field">
          <label for="signupName">Full name</label>
          <input id="signupName" class="input" type="text" placeholder="Your name" required>
        </div>
        <div class="field">
          <label for="signupEmail">Email address</label>
          <input id="signupEmail" class="input" type="email" placeholder="name@company.com" required>
        </div>
        <div class="field">
          <label for="signupPassword">Password</label>
          <input id="signupPassword" class="input" type="password" placeholder="Strong password" required>
        </div>
        <button class="btn btn-primary" type="submit">Create account</button>
      </form>
    </section>
  </main>
</body>
</html>
