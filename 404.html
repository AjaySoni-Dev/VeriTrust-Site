<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="description" content="The requested VeriTrust page could not be found.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Page Not Found | VeriTrust</title>

  <link rel="stylesheet" href="/assets/css/base/veritrust.css">

  <style>
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #090b0f; color: #f7f7f8; }
    main { width: min(38rem, calc(100% - 2rem)); padding: 3rem; text-align: center; border: 1px solid rgba(255,255,255,.12); border-radius: 1.25rem; background: rgba(255,255,255,.04); }
    .error-code { margin: 0 0 .75rem; color: #ff7a1a; font: 700 .8rem/1.2 ui-monospace, monospace; letter-spacing: .14em; }
    h1 { margin: 0 0 1rem; font-size: clamp(2rem, 7vw, 3.75rem); }
    p { margin: 0 auto 1.75rem; max-width: 32rem; color: #b8bbc3; line-height: 1.7; }
    a { display: inline-flex; padding: .8rem 1.1rem; border-radius: .65rem; background: #ff7a1a; color: #111; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/images/logo.png" width="56" height="56" alt="">
